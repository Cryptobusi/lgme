<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c100c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="lgme Gym" />
  <title>lgme Gym</title>
  <meta name="description" content="The health club beta. Sessions, groups, and support on your phone." />
  <link rel="manifest" href="/gym-manifest.webmanifest" />
  <link rel="icon" href="/icons/gym-192.png" />
  <link rel="apple-touch-icon" href="/icons/gym-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Newsreader:opsz,wght@6..72,500&display=swap" />
  <style>
    :root { --bg:#0c100c; --fg:#f4f1e8; --muted:#c5d0c2; --gold:#c6a15b; --line:#2c352b; --card:#151a15; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:Figtree,sans-serif; font-size:1.05rem; line-height:1.45; }
    header, main { padding:1rem 1rem 6.5rem; max-width:40rem; margin:0 auto; }
    h1,h2,h3 { font-family:Newsreader,serif; font-weight:500; }
    h1 { font-size:1.8rem; margin:0.2rem 0 0.6rem; }
    a { color:var(--fg); }
    .kicker { margin:0; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-size:0.75rem; }
    .muted { color:var(--muted); }
    .card, .banner { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:0.9rem 1rem; margin:0.7rem 0; }
    button, input, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:12px; min-height:48px; }
    input, select { width:100%; padding:0.55rem 0.7rem; margin-top:0.25rem; }
    button { padding:0.7rem 0.9rem; margin:0.35rem 0.35rem 0.35rem 0; }
    button.primary { background:var(--gold); color:#1a1408; border-color:var(--gold); }
    label { display:block; margin:0.55rem 0; }
    label.check { display:flex; gap:0.7rem; align-items:center; min-height:48px; }
    label.check input { width:1.3rem; height:1.3rem; margin:0; }
    .avatar { width:4rem; height:4rem; border-radius:50%; display:grid; place-items:center; background:#243024; color:var(--gold); font-size:1.6rem; }
    nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#10150f; border-top:1px solid var(--line); padding:0.25rem env(safe-area-inset-right) calc(0.25rem + env(safe-area-inset-bottom)) env(safe-area-inset-left); }
    nav button { flex:1; margin:0; min-height:52px; border:0; background:transparent; font-size:0.78rem; }
    nav button[aria-current="page"] { color:var(--gold); }
    .chart svg { width:100%; height:auto; }
    .progress-num { font-family:Newsreader,serif; font-size:2.6rem; line-height:1; margin:0.2rem 0; }
    .progress-card { border-color:var(--gold); }
    .covenant-scroll, .covenant-text { max-height:42vh; overflow:auto; white-space:pre-wrap; }
    input.short { width:12rem; display:inline-block; }
    .clarify { border-color:var(--gold); }
    footer.gym-foot { padding:0 1rem 6rem; max-width:40rem; margin:0 auto; }
  </style>
</head>
<body>
<header>
  <p class="kicker">lgme · Gym beta</p>
  <h1>Gym</h1>
  <p class="muted"><a href="/gym/covenant">Member Covenant</a></p>
</header>
<main id="gym-panel"></main>
<footer class="gym-foot"><a href="/gym/covenant">Member Covenant</a></footer>
<nav aria-label="Gym">
  <button type="button" data-route="/">Club</button>
  <button type="button" data-route="/train">Train</button>
  <button type="button" data-route="/people">People</button>
  <button type="button" data-route="/groups">Groups</button>
  <button type="button" data-route="/more">More</button>
</nav>
<script src="/js/vendor/qrcode.js"></script>
<script type="module" src="/js/gym-app.mjs"></script>
</body>
</html>
