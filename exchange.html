<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IdidIt · lgme</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/menu.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" />
  <style>
    :root { --bg:#0c100c; --fg:#f4f1e8; --muted:#c5d0c2; --faint:#8ea892; --gold:#c6a15b; --line:#2c352b; --panel:#141a13; }
    * { box-sizing: border-box; }
    html[data-look="larger"] { font-size: 125%; }
    body { margin: 0 auto; max-width: 72rem; padding: 1.25rem 1.25rem 4rem; background: var(--bg); color: var(--fg); font-family: Figtree, sans-serif; font-size: 1rem; line-height: 1.5; }
    a { color: var(--fg); }
    h1, h2, h3 { font-family: Newsreader, serif; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
    h1 { font-size: clamp(2.6rem, 7vw, 4rem); line-height: 0.95; }
    h2 { font-size: 1.8rem; }
    .kicker { margin: 0 0 0.4rem; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); font-size: 0.82rem; }
    button, input, textarea, select { font: inherit; color: var(--fg); }
    button { min-height: 44px; cursor: pointer; }
    input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); padding: 0.65rem 0.75rem; }
    textarea { min-height: 5.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .btn { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 0.55rem 0.9rem; }
    .btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
    .btn.solid:hover { background: var(--gold); border-color: var(--gold); color: var(--bg); }
    .btn[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
    .btn.solid[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); box-shadow: none; }
    .btn:disabled { opacity: 0.4; }
    .grid { display: grid; gap: 0.5rem; }
    .cols { display: grid; gap: 1.5rem; }
    @media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
    .card { border: 1px solid var(--line); background: var(--panel); padding: 0.9rem 1rem; text-align: left; width: 100%; }
    .card.on { border-color: var(--fg); }
    .card img.shot, video { width: 100%; max-height: 11rem; object-fit: cover; margin-top: 0.6rem; background: #000; }
    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 0.85rem; }
    h2, section, .block { scroll-margin-top: 4.5rem; }
    .deskmenu a[aria-current="page"] { color: var(--fg); box-shadow: inset 0 -1px 0 var(--gold); }
    .block { margin-top: 1.75rem; padding-top: 1.15rem; border-top: 1px solid var(--line); }
    .search { margin: 0.2rem 0 0.7rem; }
    .search input { flex: 1 1 16rem; max-width: none; }
    .ledger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.8rem 1.2rem; margin: 0.7rem 0; }
    .ledger p { margin: 0; }
    .tile { display: block; width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
    .tile .frame { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border-radius: 0.6rem; background: var(--panel); border: 1px solid var(--line); }
    .tile img { width: 100%; height: 100%; object-fit: cover; margin: 0; max-height: none; }
    .tile .badge { position: absolute; top: 0.4rem; left: 0.4rem; background: var(--bg); color: var(--fg); border-radius: 999px; padding: 0.15rem 0.45rem; font-size: 0.72rem; }
    .tile strong { display: block; margin-top: 0.4rem; font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
    img.sign { width: 100%; height: 4.5rem; object-fit: contain; background: var(--bg); border: 1px solid var(--line); margin-top: 0.5rem; }
    canvas.pad { width: 100%; height: 8rem; touch-action: none; background: var(--bg); border: 1px solid var(--line); margin-top: 0.4rem; }
    .settle { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    label.field { display: block; margin-top: 0.8rem; font-size: 0.92rem; }
    .check { display: flex; gap: 0.6rem; align-items: flex-start; margin-top: 0.9rem; }
    .check input { width: auto; margin-top: 0.3rem; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 1.2rem 0; }
    .back { color: var(--muted); text-decoration: none; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin: 0.75rem 0 0.45rem; }
    .num { font-family: Newsreader, serif; font-size: 2rem; line-height: 1; }
    .tile .frame.bare { aspect-ratio: auto; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 0.3rem; padding: 0.8rem 0.9rem 0.85rem; }
    .tile .frame.bare .badge { position: static; }
    .tile .frame.bare .gloss { font-family: Newsreader, serif; font-size: 1.25rem; line-height: 1.15; }
    .seats p { margin: 0.25rem 0 0; }
    .hold, .pair { border-bottom: 1px solid var(--line); padding: 0.8rem 0 1rem; }
    .pair p, .waynote { margin: 0 0 0.35rem; }
    .reason { color: var(--muted); }
    .toast { margin: 0.6rem 0; border-left: 2px solid var(--gold); padding-left: 0.7rem; }
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 0.45rem; margin-top: 0.7rem; }
    .shelf { display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem; min-height: 5.4rem; }
    .shelf .count { font-family: Newsreader, serif; font-size: 1.45rem; line-height: 1.05; }
    .trial { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.2rem, 1fr)); gap: 0.4rem; margin-bottom: 1rem; }
    @media (min-width: 900px) { .cols { gap: 2rem; } }
    @media (max-width: 640px) {
      .stats, .ledger { grid-template-columns: 1fr; }
      .settle { grid-template-columns: 1fr; }
      h1 { font-size: 2.7rem; }
    }
  </style>
</head>
<body>
  <nav class="deskmenu" aria-label="Desk">
    <a href="/study">Study/Prerequisite</a>
    <a href="/#ididit">IDidit</a>
    <a href="/exchange" aria-current="page">IdidIt</a>
    <a href="/technical">Technical</a>
    <a href="/preparation">Preparation</a>
    <a href="/">Desk</a>
  </nav>
  <div id="app"></div>
  <script>
    const KYC_KEY = "lgme-kyc-v1";
    const DESK_KEY = "lgme-exchange-v1";
    const CATS = ["Tools","Books","Skills","Kitchen","Plants","Time","Music","Studio","Rides","Care"];
    const WAYS = [
      ["settle","Settle","Accept the swap. The offer becomes a line."],
      ["furlough","Furlough","Pause the payment. The date stays shown."],
      ["tokens","Tokens","A named promise. Not cash at the register."],
      ["service","Service","Settle in work that can be shown."],
      ["retire","Retire","A named surplus cancels the line. Only this cancels it."],
      ["floor","Floor","The basket is paid first, from what is already named."],
      ["receivable","Receivable","Kept on IhavIt. It does not clear at par."]
    ];
    const STOP = new Set("a an the and or for with to of in on it my your some any from at by is are this that i you we they not but if so as be was were too its also into over per our have has had help looking come one".split(" "));
    const ENDINGS = [
      ["herself","Do the work","She does the work, on the day she names. The count stays."],
      ["hours","Name the hours","The hours are named now. A later miss adds nothing."],
      ["iou","IOU","Someone else does the work and collects equal value, in the exchange they decide."],
      ["wait","Wait","The date stays. She is not late. The count stays."],
      ["open","Leave it open","It is not called paid. The count stays. Nothing is added."],
      ["no","Say no","The no stays. One new bill may follow it. The count does not grow."],
      ["walk","Walk away","The page says nothing is owed."],
      ["aside","Set aside","Cancel only from money already set aside for this bill. Food cannot be used."]
    ];
    function endingOf(id) { return ENDINGS.find((row) => row[0] === id); }
    const DAY = 86400000;
    const ANCHOR = Date.UTC(2026, 9, 18);
    function esc(value) {
      return String(value ?? "")
        .replace(/\u0026/g, "\u0026amp;")
        .replace(/</g, "\u0026lt;")
        .replace(/>/g, "\u0026gt;")
        .replace(/"/g, "\u0026quot;")
        .replace(/'/g, "\u0026#39;");
    }
    const media = (src, kind) => typeof src === "string" && src.startsWith("data:" + kind) ? src : "";

    function item(p) {
      return { id:p.id, side:p.side, title:p.title, detail:p.detail, category:p.category, place:p.place, by:p.by, mine:false, status:"open", createdAt: ANCHOR - p.age * DAY };
    }
    const SEED = {
      name: "You",
      pairs: [],
      done: [
        { id:"d1", haveTitle:"Ten-inch cast iron skillet", wantTitle:"Pullman loaf pan", haveBy:"Jules", wantBy:"Ivo", category:"Kitchen", note:"Left on the mill step, still warm.", createdAt: Date.UTC(2026,8,28) },
        { id:"d2", haveTitle:"Fiddle-leaf fig, five feet", wantTitle:"Monstera cutting", haveBy:"Ada", wantBy:"Ren", category:"Plants", note:"Traded at the Saturday stall.", createdAt: Date.UTC(2026,9,4) }
      ],
      listings: [
        item({id:"h1",side:"have",title:"CLA'd Minolta film body",detail:"X-700, meter works, two rolls of HP5 with it. Pickup only.",category:"Studio",place:"River ward",by:"Mara",age:1}),
        item({id:"h2",side:"have",title:"Twelve-year sourdough starter",detail:"Fed this morning. The jar and a one-page method come with it.",category:"Kitchen",place:"Old mill",by:"Jules",age:2}),
        item({id:"h3",side:"have",title:"Heirloom tomato starts",detail:"Six plants in newspaper pots. The pots are not part of the deal.",category:"Plants",place:"The yards",by:"Ada",age:0}),
        item({id:"h4",side:"have",title:"Student cello, three-quarter",detail:"Shop setup, new strings, one owner. Case included.",category:"Music",place:"Station",by:"Lev",age:4}),
        item({id:"h5",side:"have",title:"54cm steel road bike",detail:"Recently serviced. Lights and a lock come with it.",category:"Rides",place:"North lot",by:"Nia",age:3}),
        item({id:"h6",side:"have",title:"Tuesday childcare",detail:"From noon to four, one child, my place on the Hill.",category:"Care",place:"Hill",by:"Ada",age:1}),
        item({id:"h7",side:"have",title:"Japanese pull saw",detail:"Ryoba, plus water stones. I can show the setup once.",category:"Tools",place:"The yards",by:"Ken",age:5}),
        item({id:"h8",side:"have",title:"Picture books, ages four to seven",detail:"Fourteen bedtime titles, sturdy boards, no scribbles.",category:"Books",place:"Hill",by:"Priya",age:6}),
        item({id:"w1",side:"want",title:"35mm film enlarger",detail:"Any working enlarger. A spare film body would help the darkroom.",category:"Studio",place:"River ward",by:"Sasha",age:1}),
        item({id:"w2",side:"want",title:"Active sourdough starter",detail:"Baking a dinner for six and I am starting from nothing.",category:"Kitchen",place:"Station",by:"Ivo",age:0}),
        item({id:"w3",side:"want",title:"Heirloom tomato seedlings",detail:"For a balcony bed that gets afternoon light.",category:"Plants",place:"Hill",by:"Ren",age:2}),
        item({id:"w4",side:"want",title:"Cello bow and rosin",detail:"Student size is fine. I already have the cello.",category:"Music",place:"Station",by:"Sasha",age:3}),
        item({id:"w5",side:"want",title:"54cm steel commuter bike",detail:"A road or commuter, lights welcome.",category:"Rides",place:"North lot",by:"Owen",age:2}),
        item({id:"w6",side:"want",title:"Tuesday afternoon childcare",detail:"One child, ages covered from three to five. Your place or mine.",category:"Care",place:"Hill",by:"Noor",age:1}),
        item({id:"w7",side:"want",title:"A pull saw for joinery",detail:"Weekend shelf build. Stones are a bonus if they come too.",category:"Tools",place:"The yards",by:"Bea",age:4}),
        item({id:"w8",side:"want",title:"Quiet desk for two weekdays",detail:"Near the river, a window if possible, no calls.",category:"Time",place:"River ward",by:"Ren",age:0})
      ]
    };

    let kyc = null;
    let desk = null;
    let look = "set";
    const ui = { phase:"kyc", view:"desk", query:"", category:"All", selected:null, showAll:false, choice:{}, tokens:"10", until:"", composer:null, toast:"", review:null };

    function applyLook(next) {
      look = next === "larger" ? "larger" : "set";
      if (look === "larger") document.documentElement.dataset.look = "larger";
      else delete document.documentElement.dataset.look;
      try { localStorage.setItem("lgme-look", look); } catch {}
    }

    function load() {
      try { look = localStorage.getItem("lgme-look") === "larger" ? "larger" : "set"; } catch { look = "set"; }
      applyLook(look);
      try { kyc = JSON.parse(localStorage.getItem(KYC_KEY) || "null"); } catch { kyc = null; }
      if (!kyc || !(kyc.handle || kyc.name)) kyc = null;
      try { desk = JSON.parse(localStorage.getItem(DESK_KEY) || "null"); } catch { desk = null; }
      if (!desk || !Array.isArray(desk.listings)) desk = JSON.parse(JSON.stringify(SEED));
      if (!Array.isArray(desk.done)) desk.done = [];
      for (const row of desk.listings) {
        if (row.kind !== "future") continue;
        row.coins = 1;
        if (!row.buyer && kyc) {
          row.buyer = kyc.handle || kyc.name;
          row.buyerNote = "Asked for this improvement";
        }
      }
      if (!desk.listings.some((l) => l.kind === "future")) {
        const futures = [
          ["Tell me when a furlough date arrives", "A paused payment sits silent after the date."],
          ["Let me carry this book off this browser", "The desk dies with the browser."],
          ["Say why a pair is close", "Close pairs show a match and not the shared words."]
        ];
        for (const [title, detail] of futures) {
          desk.listings.push({ id: "future-" + title.slice(0, 12), side: "want", title, detail, category: "Skills", place: "This desk", by: "The desk", mine: true, status: "open", kind: "future", coins: 1, createdAt: Date.now() });
        }
      }

      ui.phase = kyc ? "desk" : "kyc";
      if (kyc && !desk.done.some((t) => t.mock)) writeTrial(false);
    }
    function save() {
      try { localStorage.setItem(DESK_KEY, JSON.stringify(desk)); } catch { ui.toast = "This browser could not store the picture or video."; }
    }
    function words(v) {
      return String(v).toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w));
    }
    function score(h, w) {
      let s = h.category === w.category ? 3 : 0;
      const hw = new Set(words(h.title + " " + h.detail));
      for (const word of words(w.title + " " + w.detail)) if (hw.has(word)) s += 2;
      return s;
    }
    function pairs(focus) {
      const open = desk.listings.filter((l) => l.status === "open" && (focus || ui.category === "All" || l.category === ui.category));
      const rows = [];
      for (const h of open.filter((l) => l.side === "have")) {
        for (const w of open.filter((l) => l.side === "want")) {
          if (focus && focus !== h.id && focus !== w.id) continue;
          const s = score(h, w);
          if (s >= (focus ? 3 : 4)) rows.push({ h, w, s });
        }
      }
      rows.sort((a, b) => b.s - a.s || a.h.title.localeCompare(b.h.title));
      return rows;
    }
    function mark(l) {
      if (l.kind === "floor") return "Floor";
      if (l.kind === "receivable") return "Receivable";
      if (l.furloughUntil && l.furloughUntil > Date.now()) return "Furloughed";
      if (l.status === "held") return "In hand";
      return l.category;
    }
    function wayLabel(id, refused) {
      if (refused) return "Refused";
      const end = endingOf(id);
      if (end) return end[1];
      return (WAYS.find((w) => w[0] === id) || ["","Settled"])[1];
    }
    function wayNote(id) {
      const end = endingOf(id);
      if (end) return end[2];
      return (WAYS.find((w) => w[0] === id) || ["", "", ""])[2];
    }
    function sharedWords(h, w) {
      const have = new Set(words(h.title + " " + h.detail));
      const found = [];
      for (const word of words(w.title + " " + w.detail)) {
        if (have.has(word) && !found.includes(word)) found.push(word);
      }
      return found;
    }
    function pairReason(h, w) {
      const bits = [];
      if (h.category === w.category) bits.push("Same shelf, " + h.category);
      const shared = sharedWords(h, w);
      if (shared.length) bits.push("Shared words: " + shared.slice(0, 6).join(", "));
      if (!bits.length) bits.push("Close on the desk");
      return bits.join(". ") + ".";
    }
    function matchList(l) {
      if (ui.category !== "All" && l.category !== ui.category) return false;
      const n = ui.query.trim().toLowerCase();
      if (!n) return true;
      return (l.title + " " + l.detail + " " + l.by + " " + l.place + " " + l.category + " " + (l.kind || "") + " " + (l.voice || "")).toLowerCase().includes(n);
    }

    function card(l) {
      const shot = media(l.photo, "image");
      const side = l.side === "have" ? "IhavIt" : "IwantIT";
      const gloss = l.side === "have" ? "I have it" : "I want it";
      const saved = l.saved ? " · Saved" : "";
      const held = l.status === "held" ? " · In hand" : "";
      if (!shot) {
        return `<button class="tile" type="button" data-act="review" data-id="${esc(l.id)}">
          <span class="frame bare"><span class="badge">${side}${saved}</span><span class="gloss">${esc(l.title)}</span><span class="faint">${gloss}${held}</span><span class="faint">${esc(l.place)}</span></span>
        </button>`;
      }
      return `<button class="tile" type="button" data-act="review" data-id="${esc(l.id)}">
        <span class="frame"><img alt="" src="${shot}" /><span class="badge">${side}${saved}</span></span>
        <strong>${esc(l.title)}</strong>
        <span class="faint">${esc(l.place)}${held}</span>
      </button>`;
    }

    function column(title, kicker, items) {
      return `<section><h2>${title}</h2><p class="faint">${kicker} ${items.length}</p>
        ${items.length ? `<div class="feed">${items.map(card).join("")}</div>` : `<p class="muted">Nothing on this side yet. Post what you have, or what you still need.</p>`}
      </section>`;
    }

    function composer() {
      const d = ui.composer;
      if (!d) return "";
      return `<form id="composer" class="card" style="margin:1rem 0">
        <h2>${d.id ? "Edit the card" : "Put it on the desk"}</h2>
        <div class="row" style="margin-top:.6rem">
          <button type="button" class="btn" data-act="side" data-side="have" aria-pressed="${d.side === "have"}">IhavIt</button>
          <button type="button" class="btn" data-act="side" data-side="want" aria-pressed="${d.side === "want"}">IwantIT</button>
        </div>
        <label class="field">Title<input name="title" value="${esc(d.title)}" /></label>
        <label class="field">Detail<textarea name="detail">${esc(d.detail)}</textarea></label>
        <div class="row" style="margin-top:.6rem">
          <button type="button" class="btn" data-act="voice">${ui.listening ? "Stop voice" : "Voice"}</button>
          <button type="button" class="btn" data-act="photo">Picture</button>
          <button type="button" class="btn" data-act="video">Video</button>
          <button type="button" class="btn" data-act="sign">Signature</button>
        </div>
        <input id="photo-file" type="file" accept="image/*" hidden />
        <input id="video-file" type="file" accept="video/*" hidden />
        ${media(d.photo,"image") ? `<img class="shot" alt="" src="${media(d.photo,"image")}" />` : ""}
        ${media(d.video,"video") ? `<video controls src="${media(d.video,"video")}"></video>` : ""}
        ${d.signing && !d.signature ? `<canvas class="pad" id="pad" width="640" height="180" aria-label="Signature"></canvas>` : ""}
        ${d.signature ? `<img class="sign" alt="Signature" src="${d.signature}" /><button type="button" class="btn" data-act="resign">Sign again</button>` : ""}
        <label class="field">Shelf<select name="category">${CATS.map((c) => `<option ${c === d.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        <label class="field">Where<input name="place" value="${esc(d.place)}" /></label>
        <label class="field">Your name<input name="by" value="${esc(d.by)}" /></label>
        <div class="row" style="margin-top:.8rem">
          <button type="button" class="btn" data-act="read">Read aloud</button>
          <button class="btn solid" type="submit">${d.id ? "Save" : "Post"}</button>
          <button type="button" class="btn" data-act="close-post">Close</button>
        </div>
      </form>`;
    }

    function holdRows() {
      return desk.pairs.map((p) => {
        const h = desk.listings.find((l) => l.id === p.haveId);
        const w = desk.listings.find((l) => l.id === p.wantId);
        return h && w ? { p, h, w } : null;
      }).filter(Boolean);
    }
    function holdArticle(p, h, w) {
      const choice = ui.choice[p.id] || "";
      const due = p.furloughUntil && p.furloughUntil <= Date.now();
      const state = due ? "The date has arrived" : p.furloughUntil ? "Furloughed until " + new Date(p.furloughUntil).toLocaleDateString() : "In hand";
      return `<article class="hold">
          <p class="faint">${esc(state)}</p>
          <p><strong>${esc(h.title)}</strong> with <strong>${esc(w.title)}</strong></p>
          <div class="ledger">
            <p style="margin:0"><span class="faint">Basket</span><br>${esc(h.title)}<br><span class="muted">Already named. Paid first.</span></p>
            <p style="margin:0"><span class="faint">Fee</span><br>${choice === "tokens" ? esc(ui.tokens) + " tokens" : "None"}<br><span class="muted">Same charge. No friend rate.</span></p>
            <p style="margin:0"><span class="faint">Remainder</span><br>${choice === "retire" ? "Zero" : esc(w.title)}<br><span class="muted">Named, including zero.</span></p>
          </div>
          <p class="muted">An offer is not a line until you accept it. This hold writes nothing yet.</p>
          <label class="field">Your sentence<input data-act="note" data-id="${esc(p.id)}" value="${esc(p.note)}" placeholder="Why this line cannot be shown" /></label>
          ${fullFields(p)}
          <p style="margin:.8rem 0 .4rem">Instead of paying now</p>
          <div class="settle">${WAYS.map(([id, label]) => `<button type="button" class="btn" data-act="choose" data-id="${esc(p.id)}" data-way="${id}" aria-pressed="${choice === id}">${label}</button>`).join("")}</div>

        if (best) return { category, have: best.h.title, want: best.w.title, paired: true };

    function armPad(canvas) {
      const ctx = canvas.getContext("2d");
      let drawing = false;
      const pt = (e) => {
        const r = canvas.getBoundingClientRect();
        return { x: ((e.clientX - r.left) / r.width) * canvas.width, y: ((e.clientY - r.top) / r.height) * canvas.height };
      };
      canvas.onpointerdown = (e) => {
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        ctx.strokeStyle = getComputedStyle(canvas).color || "#f4f1e8";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        const p = pt(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };
      canvas.onpointermove = (e) => {
        if (!drawing) return;
        const p = pt(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };
      canvas.onpointerup = () => {
        if (!drawing) return;
        drawing = false;
        const url = canvas.toDataURL("image/png");
        if (ui.composer) ui.composer.signature = url;
        else ui.signature = url;
      };
    }

    function blankDraft() {

    function fullFields(p) {

        ${end === "iou" ? `<label class="field">Who does the work<input data-meet="worker" data-id="${esc(p.id)}" value="${esc(p.worker || "")}" /></label><label class="field">Exchange they decide<input data-meet="exchange" data-id="${esc(p.id)}" value="${esc(p.exchange || "")}" /></label>` : ""}
        ${end === "aside" ? `<label class="field">Money already set aside<input data-meet="aside" data-id="${esc(p.id)}" value="${esc(p.aside || "")}" /></label>` : ""}
        <div class="row" style="margin-top:.6rem">
          <button class="btn" type="button" data-act="refuse-slip" data-id="${esc(p.id)}">Refuse a percent or a penalty</button>

        </div>
        ${p.slips ? `<p class="muted">A percent or a penalty was refused. The count did not grow. The bill is still to be met.</p>` : ""}`;
    }
    function asCount(value) {
      const n = Number(String(value ?? "").replace(/[^0-9.]/g, ""));
      return Number.isFinite(n) ? n : null;
    }
    function settleFull(pairId) {
      const pair = desk.pairs.find((p) => p.id === pairId);
      if (!pair) return;
      if (!endingOf(pair.ending)) { ui.toast = "Choose how to meet it."; render(); return; }
      const have = desk.listings.find((l) => l.id === pair.haveId);
      const want = desk.listings.find((l) => l.id === pair.wantId);
      if (!have || !want) return;
      const count = asCount(pair.count);
      if (count == null || count <= 0) { ui.toast = "Write the count. It stays what it is."; render(); return; }
      if (pair.baseCount == null) pair.baseCount = count;
      if (count > pair.baseCount) { ui.toast = "The count cannot go up."; render(); return; }
      const end = pair.ending;
      const means = String(pair.means || "").trim();
      const when = String(pair.when || "").trim();
      const food = String(pair.food || "").trim();
      if ((end === "herself" || end === "hours" || end === "iou") && (!means || !when)) { ui.toast = "Name the means and the time."; render(); return; }
      if (end === "iou" && (!String(pair.worker || "").trim() || !String(pair.exchange || "").trim())) { ui.toast = "Name who does the work, and the exchange they decide."; render(); return; }
      if (end === "aside") {
        const aside = String(pair.aside || "").trim();
        if (!aside) { ui.toast = "Name the money already set aside."; render(); return; }
        if (/food/i.test(aside) || (food && aside === food)) { ui.toast = "The food stays food. It was not set aside for this bill."; render(); return; }
      }
      const person = want.by;
      const shop = have.by;
      const worker = end === "iou" ? String(pair.worker).trim() : person;
      const taken = end === "iou" ? String(pair.exchange).trim() : end === "aside" ? String(pair.aside).trim() : means || "the work named";
      const stayed = "Count stayed " + count + "." + (food ? " Food stayed food." : "");
      let full = stayed + " " + person + " met it on their terms and time. " + worker + " collected equal value: " + taken + ". " + shop + " was paid in work that can be shown. The office can read the line and has no penalty.";
      if (end === "wait") full = stayed + " The date stays. " + person + " is not late. No one was charged.";
      if (end === "open") full = stayed + " Left open. Not called paid. No one was charged.";
      if (end === "no") full = stayed + " " + person + " said no. The no stays. Nothing was added.";
      if (end === "walk") full = stayed + " Nothing is owed. No penalty was added.";
      const done = {
        id: crypto.randomUUID(), haveTitle: have.title, wantTitle: want.title, haveBy: have.by, wantBy: want.by,
        category: have.category, note: [pair.note, means, when].filter(Boolean).join(" "),
        createdAt: Date.now(), settlement: end, full: full
      };
      const close = () => {
        desk.pairs = desk.pairs.filter((p) => p.id !== pair.id);
        desk.listings = desk.listings.filter((l) => l.id !== have.id && l.id !== want.id);
      };
      if (end === "wait" || end === "open") {
        desk.done = [done, ...desk.done];
        ui.view = "done";
        ui.toast = end === "wait" ? "The date stays. The count stays. Still in hand." : "Left open. Not called paid. The count stays.";
        save(); render(); return;
      }
      if (end === "no") {
        desk.listings = [{
          id: crypto.randomUUID(), side: "want", title: "Follows the no · " + want.title,
          detail: "One bill may follow the no. The no stays. The count does not grow.",
          category: want.category, place: want.place, by: person, mine: true, status: "open", createdAt: Date.now()
        }, ...desk.listings.map((l) => l.id === have.id || l.id === want.id ? { ...l, status: "open" } : l)];
        desk.pairs = desk.pairs.filter((p) => p.id !== pair.id);
        desk.done = [done, ...desk.done];
        ui.view = "done";
        ui.toast = "The no stays. One new bill may follow it. The count did not grow.";
        save(); render(); return;
      }
      close();
      desk.done = [done, ...desk.done];
      ui.view = "done";
      ui.toast = "Settled in full. The count stayed " + count + ".";
      save(); render();
    }
    function loadLatch() {
      if (desk.pairs.some((p) => p.id === "latch-pair")) { ui.toast = "The latch is already in hand."; render(); return; }
      const have = { id: "latch-work", side: "have", title: "Count the stock, Saturday week", detail: "Sol does the work. He collects equal value and decides the exchange.", category: "Time", place: "Pell Hardware", by: "Sol", mine: false, status: "held", createdAt: Date.now() };
      const want = { id: "latch-bill", side: "want", title: "Fix the latch", detail: "For Ana. Due Friday 30 October 2026. The count is 10. The 8 is food.", category: "Care", place: "Lane Street", by: "Ana", mine: true, status: "held", createdAt: Date.now() };
      desk.listings = [have, want, ...desk.listings.filter((l) => l.id !== "latch-work" && l.id !== "latch-bill")];
      desk.pairs.unshift({ id: "latch-pair", haveId: "latch-work", wantId: "latch-bill", note: "", createdAt: Date.now(), count: "10", food: "8 for food", means: "Sol counts the stock", when: "Saturday week, nine until noon", worker: "Sol", exchange: "A key, equal to 10", ending: "iou", baseCount: 10 });
      ui.toast = "The latch is in hand. The count is 10. Choose how she meets it.";
      save(); render();
      const needs = document.getElementById("needs");
      if (needs) needs.scrollIntoView({ block: "start" });
    }

    function apply(pairId, mode) {
      if (mode === "furlough") {
        const until = new Date(ui.until + "T12:00:00").getTime();
        if (!until) return;
        desk.pairs = desk.pairs.map((p) => p.id === pairId ? { ...p, furloughUntil: until } : p);
        const pair = desk.pairs.find((p) => p.id === pairId);
        desk.listings = desk.listings.map((l) => pair && (l.id === pair.haveId || l.id === pair.wantId) ? { ...l, furloughUntil: until } : l);
        ui.toast = "Payment furloughed. The pair stays in hand.";
        save(); render(); return;
      }
      const tokens = Number(ui.tokens);
      if (mode === "tokens" && !(tokens > 0)) { ui.toast = "Post the charge before the line is accepted."; save(); render(); return; }
      const pair = desk.pairs.find((p) => p.id === pairId);
      if (!pair) return;
      const have = desk.listings.find((l) => l.id === pair.haveId);
      const want = desk.listings.find((l) => l.id === pair.wantId);
      if (!have || !want) return;
      const done = {
        id: crypto.randomUUID(), haveTitle: have.title, wantTitle: want.title, haveBy: have.by, wantBy: want.by,
        category: have.category === want.category ? have.category : have.category + " / " + want.category,
        note: [pair.note, mode === "tokens" ? tokens + " tokens." : ""].filter(Boolean).join(" "),
        createdAt: Date.now(), settlement: mode, tokens: mode === "tokens" ? tokens : undefined,
        photo: have.photo || want.photo, signature: have.signature || want.signature
      };
      desk.pairs = desk.pairs.filter((p) => p.id !== pairId);
      if (mode === "floor") {
        desk.listings = desk.listings.filter((l) => l.id !== want.id).map((l) => l.id === have.id ? { ...l, status:"open", kind:"floor", furloughUntil: undefined } : l);
        ui.view = "have"; ui.toast = "Contributed to the floor, under IhavIt.";
      } else if (mode === "receivable") {
        desk.listings = [{
          id: crypto.randomUUID(), side:"have", title:"Receivable · " + want.title,
          detail: ("Against " + have.title + ". " + have.by + " and " + want.by + ". " + (pair.note || "")).trim(),
          category: have.category, place: have.place || want.place, by: kyc.name, mine:true, createdAt: Date.now(), status:"open", kind:"receivable",
          signature: have.signature || want.signature, photo: have.photo || want.photo
        }, ...desk.listings.filter((l) => l.id !== have.id && l.id !== want.id)];
        ui.view = "have"; ui.toast = "Receivable is on IhavIt to sell.";
      } else {
        desk.listings = desk.listings.filter((l) => l.id !== have.id && l.id !== want.id);
        ui.view = "done";
        ui.toast = mode === "retire" ? "Retired." : mode === "service" ? "Settled as service." : mode === "tokens" ? "Swapped for tokens." : "Marked IdidIT.";
      }
      desk.done = [done, ...desk.done];
      save(); render();
    }

    function fillShelves() {
      const fills = [
        { id:"fill-books", side:"want", title:"Picture books for bedtime", detail:"Ages four to seven. Sturdy boards.", category:"Books", place:"Hill", by:"Ren" },
        { id:"fill-time", side:"have", title:"Quiet desk for two weekdays", detail:"Near the river, a window, no calls.", category:"Time", place:"River ward", by:"Mara" },
        { id:"fill-skills-have", side:"have", title:"One hour of sharpening", detail:"Tools and a lesson on the stones.", category:"Skills", place:"The yards", by:"Ken" },
        { id:"fill-skills-want", side:"want", title:"One hour of sharpening", detail:"I have the tools. I need the lesson.", category:"Skills", place:"The yards", by:"Bea" }
      ];
      const added = fills.filter((fill) => !desk.listings.some((l) => l.id === fill.id) && !desk.listings.some((l) => l.kind !== "future" && l.category === fill.category && l.side === fill.side))
        .map((fill) => ({ ...fill, mine:false, status:"open", createdAt: Date.now() }));
      if (!added.length) { ui.toast = "Every shelf already has both sides."; render(); return; }
      desk.listings = added.concat(desk.listings);
      ui.toast = "Posted the missing sides. Nothing was taken.";
      save();
      render();
    }
    function takeBook() {
      const file = { listings: desk.listings, pairs: desk.pairs, done: desk.done, at: Date.now() };
      const url = URL.createObjectURL(new Blob([JSON.stringify(file, null, 2)], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "ididit-book.json";
      link.click();
      URL.revokeObjectURL(url);
      ui.toast = "The book is a file. This desk does not keep another copy.";
      render();
    }

    app.addEventListener("click", async (event) => {
      const el = event.target.closest("[data-act]");
      if (!el) return;
      const act = el.dataset.act;
      if (act === "buyer") {
        const row = desk.listings.find((l) => l.id === el.dataset.id);
        if (row) {
          row.coins = 1;
          row.buyer = (kyc && (kyc.handle || kyc.name)) || "The desk";
          row.buyerNote = "Asked for this improvement";
          ui.toast = "Buyer: " + row.buyer + ". Kept on the future list.";
          save();
        }
        render();
        return;
      }
      if (act === "look") { applyLook(el.dataset.size); render(); return; }
      if (act === "read-seat") {
        speak("IdidIt. Checked as " + (kyc.handle || kyc.name) + ". Floor, then the promise, then the book. You may refuse a line that cannot be shown. State may tax and print. Firm may issue. The person keeps the book. Same rules bind all three. This seat checks them. It does not govern them.");
        return;
      }
      if (act === "grok") { const box = document.getElementById("grok-box"); if (box) box.hidden = !box.hidden; return; }
      if (act === "view") { ui.view = el.dataset.view; ui.showAll = false; render(); return; }
      if (act === "cat") {
        ui.category = el.dataset.cat;
        render();
        const room = document.getElementById("room");
        if (room && el.dataset.cat !== "All") room.scrollIntoView({ block: "start" });
        return;
      }
      if (act === "more") { ui.showAll = !ui.showAll; render(); return; }
      if (act === "select") { ui.selected = ui.selected === el.dataset.id ? null : el.dataset.id; render(); return; }
      if (act === "hold") {
        const { have, want } = el.dataset;
        const busy = desk.pairs.some((p) => [p.haveId, p.wantId].includes(have) || [p.haveId, p.wantId].includes(want));
        if (!busy) {
          desk.pairs.unshift({ id: "p-" + have + "-" + want, haveId: have, wantId: want, note:"", createdAt: Date.now() });
          desk.listings = desk.listings.map((l) => l.id === have || l.id === want ? { ...l, status:"held" } : l);
          ui.toast = "Held. An offer is not a line until you accept it.";
          save();
        }
        render(); return;
      }
      if (act === "release") {
        const pair = desk.pairs.find((p) => p.id === el.dataset.id);
        if (pair) {
          desk.pairs = desk.pairs.filter((p) => p.id !== pair.id);
          desk.listings = desk.listings.map((l) => l.id === pair.haveId || l.id === pair.wantId ? { ...l, status:"open" } : l);
          ui.toast = "Released. The hold writes nothing.";
          save();
        }
        render(); return;
      }
      if (act === "refuse") {
        const pair = desk.pairs.find((p) => p.id === el.dataset.id);
        const h = pair && desk.listings.find((l) => l.id === pair.haveId);
        const w = pair && desk.listings.find((l) => l.id === pair.wantId);
        if (pair && h && w) {
          const sentence = (pair.note || "").trim();
          if (!sentence) {
            ui.toast = "Write your sentence. A refusal has to be shown.";
            render();
            return;
          }
          desk.done.unshift({ id: "d-" + Date.now(), haveTitle: h.title, wantTitle: w.title, haveBy: h.by, wantBy: w.by, category: h.category, note: sentence, createdAt: Date.now(), refused: true });
          desk.pairs = desk.pairs.filter((p) => p.id !== pair.id);
          desk.listings = desk.listings.map((l) => l.id === h.id || l.id === w.id ? { ...l, status:"open" } : l);
          ui.view = "done";
          ui.toast = "Refused. The line is on the book. The offer writes nothing.";
          save();
        }
        render(); return;
      }
      if (act === "latch") { loadLatch(); return; }
      if (act === "ending") {
        desk.pairs = desk.pairs.map((p) => p.id === el.dataset.id ? { ...p, ending: el.dataset.way } : p);
        save(); render(); return;
      }
      if (act === "meet") { settleFull(el.dataset.id); return; }
      if (act === "refuse-slip") {
        desk.pairs = desk.pairs.map((p) => p.id === el.dataset.id ? { ...p, slips: (p.slips || 0) + 1, note: ((p.note || "").trim() + " Refused a percent or a penalty. The count stays.").trim() } : p);
        ui.toast = "Refused first. The count stays. The bill is still hers to meet.";
        save(); render(); return;
      }
      if (act === "choose") {
        ui.choice[el.dataset.id] = el.dataset.way;
        if (el.dataset.way === "furlough" && !ui.until) ui.until = new Date(Date.now() + 30 * DAY).toISOString().slice(0, 10);
        render(); return;
      }
      if (act === "apply") { apply(el.dataset.id, ui.choice[el.dataset.id]); return; }
      if (act === "dismiss") {
        const id = el.dataset.id;
        const pair = desk.pairs.find((p) => p.haveId === id || p.wantId === id);
        desk.pairs = desk.pairs.filter((p) => p.haveId !== id && p.wantId !== id);
        desk.listings = desk.listings.filter((l) => l.id !== id).map((l) => pair && (l.id === pair.haveId || l.id === pair.wantId) ? { ...l, status:"open" } : l);
        ui.selected = null; save(); render(); return;
      }
      if (act === "open-post") { blankDraft(); render(); return; }
      if (act === "close-post") { ui.composer = null; render(); return; }
      if (act === "edit") {
        const l = desk.listings.find((x) => x.id === el.dataset.id);
        if (!l) return;
        ui.composer = { id:l.id, side:l.side, title:l.title, detail:l.detail, category:l.category, place:l.place, by:l.by, photo:l.photo || "", video:l.video || "", signature:l.signature || "", voice:l.voice || "", signing:false };
        render(); return;
      }
      if (act === "side" && ui.composer) { ui.composer.side = el.dataset.side; render(); return; }
      if (act === "photo") { document.getElementById("photo-file").click(); return; }
      if (act === "video") { document.getElementById("video-file").click(); return; }
      if (act === "sign" && ui.composer) { ui.composer.signing = true; render(); return; }
      if (act === "resign" && ui.composer) { ui.composer.signature = ""; ui.composer.signing = true; render(); return; }
      if (act === "voice") { toggleVoice(); return; }
      if (act === "read" && ui.composer) { speak([ui.composer.title, ui.composer.detail, ui.composer.voice].filter(Boolean).join(". ")); return; }
      if (act === "review") { ui.review = el.dataset.id; render(); return; }
      if (act === "trial") { writeTrial(true); render(); return; }
      if (act === "fill") { fillShelves(); return; }
      if (act === "book") { takeBook(); return; }
      if (act === "save") {
        desk.listings = desk.listings.map((l) => l.id === el.dataset.id ? { ...l, saved: !l.saved } : l);
        save(); render(); return;
      }
      if (act === "offer") {
        const item = desk.listings.find((l) => l.id === el.dataset.item);
        const other = desk.listings.find((l) => l.id === el.dataset.other);
        if (item && other && item.status === "open" && other.status === "open") {
          const have = item.side === "have" ? item.id : other.id;
          const want = item.side === "want" ? item.id : other.id;
          const busy = desk.pairs.some((p) => [p.haveId, p.wantId].includes(have) || [p.haveId, p.wantId].includes(want));
          if (!busy) {
            desk.pairs.unshift({ id: "p-" + have + "-" + want, haveId: have, wantId: want, note: "", createdAt: Date.now() });
            desk.listings = desk.listings.map((l) => l.id === have || l.id === want ? { ...l, status: "held" } : l);
            ui.toast = "Held. An offer is not a line until you accept it.";
            ui.review = null;
            save();
          }
        }
        render(); return;
      }
      if (act === "close-review") { ui.review = null; render(); return; }
      if (act === "match") {
        ui.selected = el.dataset.id;
        ui.review = null;
        ui.toast = "Showing what sits close to this.";
        render();
        const block = document.getElementById("pairs");
        if (block) block.scrollIntoView({ block: "start" });
        return;
      }
      if (act === "read-card") {
        const l = desk.listings.find((x) => x.id === ui.review);
        if (l) speak((l.side === "have" ? "IhavIt. " : "IwantIT. ") + l.title + ". " + l.detail);
        return;
      }
      if (act === "speak-done") {
        const t = desk.done.find((x) => x.id === el.dataset.id);
        if (t) speak(wayLabel(t.settlement) + ". " + t.haveTitle + " for " + t.wantTitle);
        return;
      }
      if (act === "clear-done") { desk.done = desk.done.filter((t) => t.id !== el.dataset.id); save(); render(); }
    });

    app.addEventListener("input", (event) => {
      const el = event.target;
      if (el.dataset.meet) {
        const key = el.dataset.meet;
        desk.pairs = desk.pairs.map((p) => p.id === el.dataset.id ? { ...p, [key]: el.value } : p);
        save();
      }
      if (el.dataset.act === "note") {
        desk.pairs = desk.pairs.map((p) => p.id === el.dataset.id ? { ...p, note: el.value } : p);
        save();
      }
      if (el.dataset.act === "tokens") {
        ui.tokens = el.value;
        const article = el.closest("article");
        const ready = Number(el.value) > 0;
        const apply = article && article.querySelector("[data-act=apply]");
        if (apply) apply.disabled = !ready;
        const line = article && article.querySelector("[data-charge]");
        if (line) line.textContent = "Charge posted: " + (ready ? el.value + " tokens" : "Unnamed") + ". Same charge.";
      }
      if (el.dataset.act === "until") ui.until = el.value;
      if (ui.composer && el.name && el.form && el.form.id === "composer") ui.composer[el.name] = el.value;
    });

    app.addEventListener("change", async (event) => {
      const el = event.target;
      if (el.id === "photo-file" && el.files[0] && ui.composer) {
        ui.composer.photo = await compress(el.files[0]);
        render();
      }
      if (el.id === "video-file" && el.files[0] && ui.composer) {
        const file = el.files[0];
        if (file.size > 1500000) { ui.toast = "Use a video under 1.5 MB."; render(); return; }
        ui.composer.video = await fileToData(file);
        render();
      }
    });

    app.addEventListener("submit", (event) => {
      event.preventDefault();
      if (event.target.id === "kyc") {
        const data = new FormData(event.target);
        const bare = String(data.get("handle") || "").trim().replace(/^@/, "");
        if (!/^[A-Za-z0-9_]{1,15}$/.test(bare)) {
          const note = document.createElement("p");
          note.textContent = "Use an X handle, like @name.";
          event.target.prepend(note);
          return;
        }
        kyc = { name: "@" + bare, handle: "@" + bare, place: "", contact: "@" + bare, at: Date.now() };
        localStorage.setItem(KYC_KEY, JSON.stringify(kyc));
        desk.name = kyc.handle;
        ui.phase = "desk";
        if (!desk.done.some((t) => t.mock)) writeTrial(false);
        ui.toast = "";
        save(); render(); return;
      }
      if (event.target.id === "composer" && ui.composer) {
        const d = ui.composer;
        if (d.title.trim().length < 3 || d.place.trim().length < 2) return;
        const fields = { side:d.side, title:d.title.trim(), detail:d.detail.trim(), category:d.category, place:d.place.trim(), by:d.by.trim() || kyc.name, photo:d.photo || undefined, video:d.video || undefined, signature:d.signature || undefined, voice:(d.voice || "").trim() || undefined };
        if (d.id) desk.listings = desk.listings.map((l) => l.id === d.id ? { ...l, ...fields } : l);
        else {
          desk.listings.unshift({ id: crypto.randomUUID(), ...fields, mine:true, createdAt: Date.now(), status:"open" });
          ui.view = d.side === "have" ? "have" : "want";
        }
        desk.name = fields.by;
        ui.composer = null;
        ui.toast = d.id ? "Updated." : "Posted.";
        save(); render();
      }
    });

    function speak(text) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
    function toggleVoice() {
      const Host = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Host) { ui.toast = "Voice input is not available in this browser."; render(); return; }
      if (rec) { rec.stop(); rec = null; ui.listening = false; render(); return; }
      rec = new Host();
      rec.lang = "en-US";
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        if (ui.composer && text) {
          ui.composer.voice = ui.composer.voice ? ui.composer.voice + " " + text : text;
          ui.composer.detail = ui.composer.detail ? ui.composer.detail + " " + text : text;
        }
      };
      rec.onend = () => { rec = null; ui.listening = false; render(); };
      rec.start();
      ui.listening = true;
      render();
    }
    function fileToData(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("read"));
        reader.readAsDataURL(file);
      });
    }
    async function compress(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 960 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      return canvas.toDataURL("image/jpeg", 0.72);
    }

    load();
    render();
  </script>
</body>
</html>
