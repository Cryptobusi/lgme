<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Creo Tape · lgme</title>
  <meta name="description" content="A device-local Creo tape. A peer co-signs a deed. Nothing is written to a chain." />
  <meta name="theme-color" content="#0c100c" />
  <link rel="stylesheet" href="/menu.css" />
  <style>
    :root { --bg:#0c100c; --fg:#f4f1e8; --gold:#c6a15b; --line:#2c352b; --muted:#b7b1a4; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-sans-serif,system-ui,sans-serif; }
    a { color:var(--gold); }
    button, input { font:inherit; color:var(--fg); }
    button { background:#161b16; border:1px solid var(--line); border-radius:0; min-height:44px; }
    input { background:#101410; border:1px solid var(--line); border-radius:0; }
    .wrap { max-width:540px; margin:0 auto; padding:16px 16px 48px; }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    h1 { font-size:1.6rem; margin:0; }
    .muted { color:var(--muted); font-size:0.92rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .preset { text-align:left; padding:10px; }
    .preset[aria-pressed="true"] { border-color:var(--gold); font-weight:700; }
    .row { display:flex; gap:8px; align-items:stretch; }
    .col { display:flex; flex-direction:column; gap:8px; width:112px; }
    .field { width:100%; box-sizing:border-box; padding:12px; margin:0 0 8px; font-size:16px; }
    .card { border:1px solid var(--line); padding:12px; margin-top:10px; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .actions button { padding:8px 10px; }
    .qr { display:flex; gap:12px; align-items:flex-start; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
    .qr canvas, .qr img { background:#f4f1e8; }
    .link { font-size:12px; word-break:break-all; color:var(--muted); }
    .note { margin-top:12px; padding:12px; border:1px dashed var(--line); }
    .err { color:#e7b3a2; min-height:1.2em; }
  </style>
</head>
<body>
  <main class="wrap" id="creo-root"></main>
  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/creo-tape.js"></script>
</body>
</html>
