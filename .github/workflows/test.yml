name: test
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/data-integrity.test.mjs test/nested-schema.test.mjs test/testnet-review.test.mjs test/health-examples.test.mjs test/health-dashboard.test.mjs test/exchange-overview.test.mjs test/hedera-network.test.mjs test/mainnet-prep.test.mjs test/join-explain.test.mjs test/category-help.test.mjs test/one-tap.test.mjs test/demo-onboard.test.mjs test/health-scope.test.mjs test/model-warmup.test.mjs test/mainnet-setup.test.mjs test/field-help.test.mjs
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install chromium webkit
      - run: node test/dashboard-layout.mjs
      - run: node test/ai-assist.mjs
      - run: node test/join-explain-ui.mjs
      - run: node test/category-board.mjs
      - run: node test/one-tap-ui.mjs
      - run: node test/demo-onboard-ui.mjs
      - run: node test/stable-screens.mjs
      - run: node test/local-ai-scope.mjs
      - run: node test/sw-update.mjs
      - run: node test/ai-dock-views.mjs
      - run: node test/health-reset-ui.mjs
      - run: node test/mainnet-wording-ui.mjs
      - run: node test/health-consent-ui.mjs
      - run: node test/model-fallback-ui.mjs
      - run: node test/phone-flows-ui.mjs
