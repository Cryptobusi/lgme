name: test
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/data-integrity.test.mjs test/health-examples.test.mjs test/health-dashboard.test.mjs test/exchange-overview.test.mjs test/hedera-network.test.mjs test/mainnet-prep.test.mjs
