name: test
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test --test-timeout=120000 test/data-integrity.test.mjs test/nested-schema.test.mjs test/testnet-review.test.mjs test/health-examples.test.mjs test/health-dashboard.test.mjs test/exchange-overview.test.mjs test/hedera-network.test.mjs test/mainnet-prep.test.mjs test/join-explain.test.mjs test/category-help.test.mjs test/one-tap.test.mjs test/demo-onboard.test.mjs test/health-scope.test.mjs test/model-warmup.test.mjs test/mainnet-setup.test.mjs test/field-help.test.mjs test/evolve.test.mjs test/variant.test.mjs test/voice-mode.test.mjs test/fingerprint-prompt.test.mjs test/incognito.test.mjs test/press-feedback.test.mjs test/visit-alert.test.mjs
        timeout-minutes: 10
      - run: npm install --no-save playwright@1.49.1
        timeout-minutes: 10
      - run: npx playwright install chromium webkit
        timeout-minutes: 15
      - run: node test/dashboard-layout.mjs
        timeout-minutes: 10
      - run: node test/ai-assist.mjs
        timeout-minutes: 10
      - run: node test/join-explain-ui.mjs
        timeout-minutes: 10
      - run: node test/category-board.mjs
        timeout-minutes: 10
      - run: node test/one-tap-ui.mjs
        timeout-minutes: 10
      - run: node test/demo-onboard-ui.mjs
        timeout-minutes: 10
      - run: node test/stable-screens.mjs
        timeout-minutes: 10
      - run: node test/local-ai-scope.mjs
        timeout-minutes: 10
      - run: node test/sw-update.mjs
        timeout-minutes: 10
      - run: node test/ai-dock-views.mjs
        timeout-minutes: 10
      - run: node test/health-reset-ui.mjs
        timeout-minutes: 10
      - run: node test/mainnet-wording-ui.mjs
        timeout-minutes: 10
      - run: node test/health-consent-ui.mjs
        timeout-minutes: 10
      - run: node test/model-fallback-ui.mjs
        timeout-minutes: 10
      - run: node test/phone-flows-ui.mjs
        timeout-minutes: 10
      - run: node test/session-persist-ui.mjs
        timeout-minutes: 10
      - run: node test/passkey-signin-ui.mjs
        timeout-minutes: 10
      - run: node test/new-marks-ui.mjs
        timeout-minutes: 10
      - run: node test/dock-prompt-ui.mjs
        timeout-minutes: 10
      - run: node test/notice-slim-ui.mjs
        timeout-minutes: 10
      - run: node test/category-actions-ui.mjs
        timeout-minutes: 10
      - run: node test/my-version-ui.mjs
        timeout-minutes: 10
