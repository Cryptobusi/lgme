<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help develop a category · lgme</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/preview.css" />
  <link rel="stylesheet" href="/site-nav.css" />
  <script src="/js/stable-screen.js"></script>
  <style>
    label { display: block; margin: 0.7rem 0 0.25rem; }
    input, textarea { width: 100%; box-sizing: border-box; font: inherit; min-height: 44px; padding: 0.45rem 0.6rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
    textarea { min-height: 6rem; }
    button { margin-top: 0.7rem; }
    #want-status, #want-helper { min-height: 1.4rem; }
    #want-suggest-row { min-height: 44px; }
  </style>
</head>
<body>
  <p class="kicker"><a href="/">Categories</a></p>
  <h1>Help develop this</h1>
  <p>This is an IwanIT. One tap posts it after you confirm. Nothing is sent until then.</p>
  <p id="want-helper" class="helper-note"></p>
  <form id="want-form">
    <label for="want-kind">Type</label>
    <input id="want-kind" name="kind" value="IwanIT" readonly />
    <label for="want-category">Category</label>
    <input id="want-category" name="category" readonly />
    <label for="want-title">Title</label>
    <input id="want-title" name="title" maxlength="80" required data-help="This is the title of the IwanIT note. It tells the owner what you want to help build." data-options="I can help test|I can write plain words|I can try the phone flow" />
    <label for="want-body">Note</label>
    <textarea id="want-body" name="body" maxlength="280" required data-help="A short note about how you can help. It is sent to the owner, not written on chain." data-options="I can try the steps on my phone.|I can point out unclear words."></textarea>
    <label for="want-skill">Skill, optional</label>
    <input id="want-skill" name="skill" maxlength="80" data-help="A skill you can offer. Optional. It goes to the owner with the IwanIT, not on chain." data-options="Testing|Plain words|Phone flows" />
    <label for="want-time">Time, optional</label>
    <input id="want-time" name="time" maxlength="40" data-help="When you can help. Optional. It is not written on chain." data-options="This week|An hour|Whenever" />
    <p id="want-suggest-row"><button type="button" id="want-suggest" hidden>Suggest wording</button></p>
    <p><button type="submit" id="want-confirm">Confirm IwanIT</button></p>
    <p id="want-status" role="status"></p>
  </form>
  <script type="module" src="/js/develop-page.mjs"></script>
<script src="/js/site-nav.js"></script>
</body>
</html>
